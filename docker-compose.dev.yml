# Local development: Postgres + MinIO only; run the app with `npm run dev`.
# docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: jobcard, POSTGRES_PASSWORD: devpass, POSTGRES_DB: jobcard }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  minio:
    build: { context: ., dockerfile: minio.Dockerfile }
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata-dev:/data]
volumes:
  pgdata-dev:
  miniodata-dev:
