# Production on a single VPS. Postgres and MinIO are never published; the app listens on localhost only.
# Behind an existing host nginx (shared server): `docker compose up -d` and proxy to 127.0.0.1:${APP_PORT}.
# Dedicated server with no web server: `docker compose --profile bundled-nginx up -d` (uses nginx/ + certbot).
name: primex

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:${APP_PORT:-3090}:3000"]
    mem_limit: 1g
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    logging: *logging

  minio:
    # Final community release built from source (minio.Dockerfile) under a PRIVATE tag.
    # Never point this at a shared tag such as minio/minio:latest: `--build` would retag it for every project on the host.
    image: primex-minio:RELEASE.2025-10-15T17-29-55Z
    build: { context: ., dockerfile: minio.Dockerfile }
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      retries: 10
    logging: *logging

  nginx:
    profiles: [bundled-nginx]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on: [app]
    logging: *logging

volumes:
  pgdata:
  miniodata:
  certbot-www:
