# Host nginx vhost (shared server): /etc/nginx/sites-available/primex.theprid.com → app on 127.0.0.1:3090.
#
# IMPORTANT: this server has a *.theprid.com wildcard vhost. Never run `certbot --nginx -d primex.theprid.com`
# without the 443 block below already present — certbot would install the cert into the wildcard vhost
# instead. Renewals (`certbot renew`) are safe; they only replace the cert files.
server {
    listen 80;
    listen [::]:80;
    server_name primex.theprid.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name primex.theprid.com;

    ssl_certificate /etc/letsencrypt/live/primex.theprid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primex.theprid.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 60m; # up to 30 compressed photos per job card

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
