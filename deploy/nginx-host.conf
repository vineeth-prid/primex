# Host nginx vhost for a shared server: /etc/nginx/sites-available/primex.theprid.com
# TLS lines are added by `certbot --nginx -d primex.theprid.com`.
server {
    listen 80;
    listen [::]:80;
    server_name primex.theprid.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 60m; # up to 30 compressed photos per job card

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
